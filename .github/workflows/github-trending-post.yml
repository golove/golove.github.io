name: Generate GitHub Trending Post

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force generation even if the last post is within 3 days
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 1 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: github-trending-post
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      FORCE_GENERATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate trending post
        run: node scripts/github-trending-post.mjs

      - name: Detect content changes
        id: changes
        run: |
          if git status --short | grep . >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run checks
        if: steps.changes.outputs.changed == 'true'
        run: pnpm check

      - name: Build site
        if: steps.changes.outputs.changed == 'true'
        run: pnpm build

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/posts
          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi
          git commit -m "Add GitHub trending roundup"
          echo "Git status before rebase:"
          git status --short
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
